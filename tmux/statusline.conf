# vim: ft=tmux

set -g status on
set -g status-interval 1
set -g status-justify left

set -g status-left-length 100
set -g status-right-length 100

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-bg default
set -g status-style "fg=#aeafb0,bg=default"

set -g mode-style "fg=#aeafb0,bg=#073642"

set -g message-style "fg=#aeafb0,bg=#073642"
set -g message-command-style "fg=#aeafb0,bg=#073642"

set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#aeafb0"

set -g status-left "#[fg=#073642,bg=#aeafb0,bold] #S #[fg=#aeafb0,bg=#93a1a1,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#93a1a1,bold] #(whoami) #[fg=#93a1a1,bg=default]"

set -g status-right "#[fg=#586e75,bg=default,nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#586e75]#[fg=#657b83,bg=#586e75,nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#657b83]#[fg=#93a1a1,bg=#657b83,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#93a1a1,bold] #h "

setw -g window-status-separator ""

setw -g window-status-style "NONE,fg=#839496,bg=default"
setw -g window-status-activity-style "underscore,fg=#839496,bg=default"

setw -g window-status-format '#[fg=default,bg=default]#[default] #I  #{b:pane_current_path} #[fg=default,bg=default,nobold,nounderscore,noitalics]'

setw -g window-status-current-format '#[fg=default,bg=#aeafb0]#[fg=#657b83,bg=#aeafb0] #I #[fg=#aeafb0,bg=#657b83] #{b:pane_current_path} #[fg=#657b83,bg=default,nobold]'