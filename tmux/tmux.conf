# vim: ft=tmux

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g mouse on

set -g history-limit 10000

# Address vim mode switching delay
set -s escape-time 0

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

setw -g monitor-activity on
set -g visual-activity on

set -g bell-action none
set -g visual-bell off

set -g focus-events on

# Allow terminal-safe passthrough sequences, such as Ghostty notifications.
set -g allow-passthrough on

set -g set-titles on
set -g set-titles-string "#T"

unbind C-b
set -g prefix C-s
bind -r C-s send-prefix

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

unbind C-z

bind - split-window -v -c '#{pane_current_path}'
bind \\ split-window -h -c '#{pane_current_path}'

bind -r C-k select-window -t :-
bind -r C-j select-window -t :+

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind b break-pane
bind q kill-pane

setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Space send -X jump-again
bind -T copy-mode-vi 0 send -X back-to-indentation

bind y run 'tmux save-buffer - | pbcopy'
bind C-y run 'tmux save-buffer - | pbcopy'

set -g status-position top

set -g status-style bg=default,fg=colour136

setw -g window-status-style fg=colour244,bg=default,dim
setw -g window-status-current-style fg=colour166,bg=default,bright

set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour136,bg=default

set -g message-style bg=colour235,fg=colour166

set -g display-panes-active-colour colour33
set -g display-panes-colour colour166

setw -g clock-mode-colour colour64

if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

source ~/.config/tmux/statusline.conf

source ~/.config/tmux/utility.conf
