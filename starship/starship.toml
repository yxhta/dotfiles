add_newline = true

command_timeout = 1000

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
untracked = ""

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "

[aws]
symbol = " "
style = "bold yellow"

[gcloud]
disabled = true

[buf]
disabled = true

[docker_context]
symbol = " "
style = "blue condensed"
disabled = true

[kubernetes]
symbol = "☸ "
style = "cyan"
disabled = true

[nodejs]
symbol = " "
style = "bold green"

[package]
disabled = true

[python]
symbol = " "
style = "bold yellow"

[rust]
symbol = " "
style = "bold red"

[golang]
symbol = " "
style = "bold cyan"
