onboarding = false

[theme]
name = "kanagawa"
auto_switch = false

[keys]
prefix = "ctrl+s"

split_vertical = "prefix+backslash"

previous_tab = "prefix+ctrl+k"
next_tab = "prefix+ctrl+j"

close_pane = "prefix+q"
detach = "prefix+d"

workspace_picker = "prefix+s"
settings = "prefix+shift+s"

navigate_workspace_down = "j"
navigate_workspace_up = "k"

focus_agent = "prefix+alt+1..9"
next_agent = "prefix+n"
previous_agent = "prefix+p"

goto = "prefix+w"

open_worktree = "prefix+shift+o"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "yxhta.agents-picker.open"
description = "agents picker"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+v"
type = "popup"
command = "hunk diff --watch"
description = "hunk diff"
width = "80%"
height = "80%"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false

show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "terminal"

[experimental]
kitty_graphics = true
pane_history = true

[ui.sound]
enabled = false
