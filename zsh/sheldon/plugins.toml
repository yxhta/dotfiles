shell = "zsh"

[plugins]

[plugins.fzf-history]
github = "joshskidmore/zsh-fzf-history-search"

[plugins.zsh-completions]
github = "zchee/zsh-completions"
dir = "src"
apply = ["fpath"]

[plugins.compinit]
inline = '''
autoload -Uz compinit
zcompdump="${XDG_CACHE_HOME:-$HOME/.cache}/zsh/zcompdump"
mkdir -p "${zcompdump:h}"
if [[ -n "$zcompdump"(#qN.mh-24) ]]; then
  compinit -C -d "$zcompdump"
else
  compinit -d "$zcompdump"
fi
if [[ -s "$zcompdump" && (! -s "${zcompdump}.zwc" || "$zcompdump" -nt "${zcompdump}.zwc") ]]; then
  zcompile "$zcompdump"
fi
'''

# fzf-tab must load before plugins that wrap ZLE widgets (autosuggestions and
# syntax-highlighting below). Reordering breaks the widget chain.
[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"

[plugins.autosuggestions]
github = "zsh-users/zsh-autosuggestions"

[plugins.syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"

[plugins.fzf]
inline = "if command -v fzf >/dev/null 2>&1; then eval \"$(fzf --zsh)\"; fi"
